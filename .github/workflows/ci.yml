# Backend (ruff, mypy, pytest against real Postgres + Redis), web
# (typecheck, lint, vitest), desktop (lint, vitest), the two Next.js apps
# (typecheck, lint, vitest, build) and a dependency audit. `main` auto-deploys
# to Railway, so this is the gate a push has to clear; the jobs are
# independent and run in parallel.
#
# Supply chain: every action is pinned to a full commit SHA (a tag can be
# moved to other code; the comment says which release it was), and the token
# is read-only — nothing here writes to the repo. Bump an action by resolving
# its tag: `git ls-remote https://github.com/actions/<name> refs/tags/<tag>`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image + credentials as docker-compose.yml, and the settings
      # defaults (packages/core/settings.py) already point at localhost with
      # these, so the tests need no .env.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noey
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: noey_tiktok
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noey -d noey_tiktok"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: noey
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: noey_tiktok
      REDIS_URL: redis://localhost:6379/0
      # The seed the API tests log in with (tests/test_auth.py) — the same
      # defaults scripts/migrate_to_multitenant.py uses, spelled out so a
      # change there fails here loudly rather than by a mystery 401.
      SEED_EMAIL: admin@noey.local
      ADMIN_PASSWORD: ChangeMe123!
      SENDGRID_API_KEY: ""
      WALLET_MOCK_TOPUP: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # The video tests shell out to ffmpeg/ffprobe (packages/video/ffmpeg_bin.py).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Exactly what the image installs (hash-checked, like the Dockerfile),
      # plus the dev extras on top.
      - run: pip install --no-deps --require-hashes -r requirements.lock && pip install --no-deps -e . && pip check
      # Pinned to what the venv ran on 2026-09-27: ruff widened its default
      # rule set across 0.x releases, so an unpinned ruff moves the goalposts.
      - run: pip install "pytest==9.1.1" "pytest-asyncio==1.4.0" "ruff==0.16.7" "mypy==2.3.1"
      # ADVISORY until the baseline is clean: on 2026-09-27 `ruff check .`
      # reported ~400 pre-existing findings (mostly I001/UP007/B008/RUF100)
      # and `mypy .` stops at "scripts/migrate_to_multitenant.py found twice
      # under different module names" (scripts/ has no __init__.py, so the
      # file is both `scripts.migrate_to_multitenant` and a top-level module).
      # Fix those, then drop `continue-on-error` so they gate like pytest.
      - run: ruff check .
        continue-on-error: true
      - run: mypy .
        continue-on-error: true
      # Migrate + seed once, up front: the tests use ASGITransport, which does
      # not run the app lifespan, so nothing else creates the tables or the
      # admin account they expect.
      - run: alembic upgrade head
      - run: python -m scripts.migrate_to_multitenant
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/app
    env:
      # Lint and unit tests need neither the Electron binary nor the native
      # rebuild the postinstall runs (electron-builder install-app-deps).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - run: npm ci --ignore-scripts
      # No typecheck yet: it fails on pre-existing TS2307 errors (module not
      # found). Add `npm run typecheck` once that baseline is clean.
      - run: npm run lint
      - run: npm test

  # The marketing/account site and the admin dashboard: same checks, same
  # Node as their Dockerfiles. The build is the one the image runs, so a
  # Next.js build break fails here instead of on the Railway deploy.
  next:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [noey-frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # noey-frontend's next.config.ts refuses a production build without
      # these (they are inlined into canonicals and links); the admin ignores
      # them. Same defaults as noey-frontend/Dockerfile.
      NEXT_PUBLIC_SITE_URL: https://noeystudio.com
      NEXT_PUBLIC_APP_URL: https://noey-frontend-production.up.railway.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Known-vulnerable dependencies. Gating on what ships to users: the Python
  # lock the image installs, and the RUNTIME (non-dev) npm tree at high or
  # critical — the Vite/Next toolchains are devDependencies that never reach a
  # browser or server. The desktop row is advisory until the Electron upgrade
  # lands (electron <41.10.6 is flagged high on 2026-09-30); drop its
  # continue-on-error then so a regression gates like the others.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pip install "pip-audit==2.10.1"
      - run: pip-audit --disable-pip --require-hashes -r backend/requirements.lock
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: noey-frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: admin
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop/app
        continue-on-error: true
