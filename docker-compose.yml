# Full stack for Noey Tiktok: postgres + redis + api + worker + web + site + admin.
services:
  redis:
    image: redis:7-alpine
    container_name: noey_redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # Use 6380 on host to avoid conflict with other local Redis instances.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: noey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-noey_tiktok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - noey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noey} -d ${POSTGRES_DB:-noey_tiktok}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: noey_api
    restart: unless-stopped
    env_file:
      - .env
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      # The container talks to postgres INSIDE the network, where it always
      # listens on 5432 — POSTGRES_PORT in .env only moves the published host
      # port, so inheriting it from env_file would break this connection.
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      # Where uploads, renders and web project files live. Must be the SAME
      # volume the worker mounts — see the `noey_data` note below.
      DATA_DIR: /data
      PORT: "8000"
    volumes:
      - noey_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    container_name: noey_worker
    restart: unless-stopped
    command: ["python", "-m", "services.worker"]
    # BOTH files, same as api. Loading only the root .env left the worker — the
    # process that runs every transcription and render — without
    # ELEVENLABS_API_KEY, so every talking_head and speech mode failed while the
    # API looked correctly configured.
    env_file:
      - .env
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"   # see the api service — host publish port is separate
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - noey_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The browser build — web/, not the legacy frontend/ dashboard, which is what
  # this service used to build and ship.
  #
  # VITE_BACKEND_URL is a BUILD argument: it is compiled into the bundle and
  # into the page's Content-Security-Policy, so changing it needs
  # `docker compose build web`, not a restart.
  web:
    build:
      context: ./web
      args:
        VITE_BACKEND_URL: http://localhost:8000
    container_name: noey_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

  # The Noey Studio marketing + account site (noey-frontend/, Next.js). Its
  # NEXT_PUBLIC_* values are BUILD arguments (inlined by Next), so changing
  # them needs `docker compose build site`. API_URL is read at run time and
  # uses the compose network — the browser never calls the API directly.
  site:
    build:
      context: ./noey-frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_APP_URL: http://localhost:5174
    container_name: noey_site
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      PRICES_REVALIDATE_SECRET: ${PRICES_REVALIDATE_SECRET:-}
    depends_on:
      - api
    ports:
      - "3000:3000"

  # The admin dashboard (admin/, Next.js). Server-side BFF only: it talks to the
  # API over the compose network and the browser never sees the API's URL.
  # Set PRICES_REVALIDATE_SECRET (same value on `site`) so a price edit
  # refreshes the marketing site's pricing pages at once.
  admin:
    build: ./admin
    container_name: noey_admin
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      ADMIN_URL: http://localhost:3001
      SITE_URL: http://site:3000
      PRICES_REVALIDATE_SECRET: ${PRICES_REVALIDATE_SECRET:-}
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  noey_pgdata:
  noey_redis_data:
  # Uploads, renders and web project files. api and worker BOTH mount it: the
  # worker writes what the API serves, and without a shared volume every
  # transcode reported success while the download 404'd forever. Named, so a
  # `docker compose up` after a rebuild does not take a user's footage with it.
  noey_data:
