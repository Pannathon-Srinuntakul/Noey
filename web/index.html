<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to
         anything but 0 — the shell uses it to clear the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Noey Studio</title>
    <link rel="icon" type="image/svg+xml" href="/noey-mark.svg" />
    <!--
      No `media:` scheme here — project files are served by the service worker
      from this origin instead. `worker-src` covers both the render worker and
      the media worker. `'wasm-unsafe-eval'` is for the AAC fallback encoder,
      which is WebAssembly: naming `script-src` at all blocks WASM compilation
      without it, and the fallback exists precisely for the browsers whose
      native AudioEncoder has no AAC.

      `%BACKEND_ORIGIN%` is substituted at build time from VITE_BACKEND_URL by
      the plugin in vite.config.ts; `%DEV_ORIGINS%` becomes the local API
      origins under `vite dev` and nothing in a build. Vite does not expand env into HTML on its
      own, so this used to be a hard-coded origin — which silently blocked
      every request on any other deployment, before it left the page, with the
      UI reporting only "เชื่อมต่อ server ไม่ได้".

      `%SENTRY_ORIGIN%` is the error-monitoring ingest host taken from
      VITE_SENTRY_DSN, and empty when that is unset (monitoring off).
      `%TURNSTILE_ORIGIN%` is https://challenges.cloudflare.com when
      VITE_TURNSTILE_SITE_KEY is set (the bot check's script + iframe) and
      empty otherwise; `frame-src 'self'` alone is what default-src gave.
      Google sign-in adds nothing here: accounts.google.com is a top-level
      navigation, not a fetch, script or frame.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' %TURNSTILE_ORIGIN%; frame-src 'self' %TURNSTILE_ORIGIN%; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: %BACKEND_ORIGIN% %UPLOAD_ORIGIN% %SENTRY_ORIGIN% %DEV_ORIGINS%"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
